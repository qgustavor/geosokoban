name: CI and Pages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete PR/feature-branch checks, but let an active publication finish.
# Pushes and manual runs on the default branch share the same queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    env:
      CI: 'true'
      E2E_SERVER: preview
    outputs:
      pages-artifact: ${{ steps.site.outputs.artifact_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run behavior tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Validate the prepared scenery atlas
        run: node scripts/check-biomes.js --require-data

      # PRs (including forks) never need a configured Pages site or publishing access.
      - name: Read GitHub Pages configuration
        id: pages
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set build and browser-test paths
        id: site
        env:
          SITE_BASE_PATH: ${{ steps.pages.outcome == 'success' && format('{0}/', steps.pages.outputs.base_path) || '/ci-preview/' }}
        run: |
          printf 'BASE_PATH=%s\n' "$SITE_BASE_PATH" >> "$GITHUB_ENV"
          # Keep the producing attempt's name when only a failed deploy is rerun.
          printf 'artifact_name=github-pages-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Build production site
        run: npm run build

      # Both Playwright projects use Chromium; mobile is touch/viewport emulation.
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Test the built game on desktop and mobile
        run: npm run test:e2e

      - name: Upload browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # A failed test/build skips this step and prevents the dependent deploy job.
      - name: Upload the tested Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.site.outputs.artifact_name }}
          path: dist
          retention-days: 7

  deploy:
    name: Deploy Pages
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # No checkout, install or rebuild: publish exactly what Validate exercised.
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.validate.outputs.pages-artifact }}
